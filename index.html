<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素周期表 · 三维重建</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./assets/three.module.js",
    "three/addons/": "./assets/addons/"
  }
}
</script>
</head>
<body>
  <div id="scene"></div>
  <div id="loading">正在构建三维模型…</div>

  <header>
    <h1>元素周期表 <em>三维重建</em></h1>
    <p class="sub">1869 门捷列夫 → 2026 · 118 种元素 · 三种立体形态</p>
  </header>

  <div id="toolbar">
    <div class="row" id="viewRow">
      <button class="btn view active" data-view="classic">经典立体</button>
      <button class="btn view" data-view="rings">周期环塔</button>
      <button class="btn view" data-view="helix">序数螺旋</button>
    </div>
    <div class="row" id="propRow">
      <span class="lbl">高度映射</span>
      <select id="propSel">
        <option value="flat">平整</option>
        <option value="rad" selected>原子半径（共价）</option>
        <option value="eneg">电负性</option>
        <option value="ie1">第一电离能</option>
        <option value="mass">原子质量</option>
      </select>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="histChk"><span>1869 已知视角</span></label>
      <label class="chk"><input type="checkbox" id="rotChk"><span>自动旋转</span></label>
    </div>
    <div class="row">
      <input id="search" type="text" placeholder="搜索：符号 / 中文名 / 序数" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn" id="resetBtn">重置视角</button>
      <button class="btn" id="glbBtn">导出 GLB 模型</button>
    </div>
  </div>

  <div id="legend"></div>

  <aside id="panel" class="hidden">
    <button id="panelClose" aria-label="关闭">×</button>
    <div id="panelBody"></div>
  </aside>

  <footer>
    拖拽旋转 · 滚轮缩放 · 右键平移 · 点击元素看详情
    <span class="src">数据口径：IUPAC 原子量（2021）· Cordero 2008 共价半径 · 泡令电负性；104 号起多为预测值</span>
  </footer>

  <div id="toast" class="hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
